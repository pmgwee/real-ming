# Native Hermes settings for the Real-Ming Malaysia host.
#
# This is a reviewable, secret-free fragment. Merge these keys into
# $HERMES_HOME/config.yaml (or apply them with `hermes config set`); do not
# replace the file because it also contains the selected model, toolsets and
# gateway settings. Credentials remain in Hermes' protected .env/auth.json.

# Real-Ming states no opinion about Hermes's memory system.
#
# It previously pinned memory_enabled, user_profile_enabled, write_approval and
# two character limits here. Checked against the shipped configuration on
# 7 September 2026, the limits were already Hermes's own defaults (2200 / 1375)
# and write_approval was never set on the host at all -- so the block changed
# nothing it claimed to change, while carrying a `write_approval: true` that
# would have silently gated every memory write on the next configuration pass.
#
# Memory is a native Hermes feature. Real-Ming's approval mechanisms exist for
# consequential real-world actions -- money, releases, outbound messages -- not
# for the agent's own working memory, and gating it there costs quality without
# buying safety. Sensitive Secret exclusion does not depend on any setting here.
#
# Leave these to Hermes. If a memory setting ever needs changing, change it in
# Hermes and record why; do not reintroduce it to this fragment.

# The bundled Obsidian skill reads this environment variable. The systemd unit
# supplies the absolute path; it is intentionally separate from the generated
# Real-Ming CEO projection under /var/lib/real-ming/obsidian.
# OBSIDIAN_VAULT_PATH=/var/lib/hermes-real-ming/obsidian-vault
